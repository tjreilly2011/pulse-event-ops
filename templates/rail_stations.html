{% extends "layout.html" %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold">Rail Stations</h1>
</div>

<div class="overflow-x-auto">
  <table class="table table-zebra w-full">
    <thead>
      <tr>
        <th>Status</th>
        <th>Name</th>
        <th>Code</th>
        <th>Region</th>
      </tr>
    </thead>
    <tbody>
      {% for station in stations %}
      <tr>
        <td>
          <span class="inline-block w-3 h-3 rounded-full {{ station.dot_class }}"></span>
        </td>
        <td class="font-semibold">
          <a href="/dashboard/rail/stations/{{ station.id }}" class="link link-primary">{{ station.name }}</a>
        </td>
        <td class="font-mono">{{ station.code }}</td>
        <td>{{ station.region }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
